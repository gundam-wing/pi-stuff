<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101412" />
    <meta name="description" content="Private live view from the Raspberry Pi camera" />
    <title>Pi Camera</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">PRIVATE CAMERA</p>
          <h1>Live monitor</h1>
        </div>
        <div class="status" id="status" data-phase="starting">
          <span class="status-dot"></span>
          <span id="status-label">Connecting</span>
        </div>
      </header>

      <section class="viewer" aria-label="Live camera">
        <video id="video" muted autoplay playsinline controls></video>
        <div class="placeholder" id="placeholder">
          <div class="camera-icon" aria-hidden="true"></div>
          <p id="message">Waiting for the camera stream…</p>
          <button id="retry" type="button">Retry now</button>
        </div>
      </section>

      <section class="events" aria-label="Motion stills">
        <div class="events-header">
          <h2>Motion</h2>
          <span id="motion-score"></span>
        </div>
        <p id="events-empty">No motion yet.</p>
        <div id="events-strip" class="events-strip" hidden></div>
      </section>

      <footer>
        <span id="connection">Checking stream</span>
        <span class="meta">
          <span id="restarts"></span>
          <span id="revision"></span>
        </span>
      </footer>
    </main>
    <dialog id="lightbox" class="lightbox" aria-label="Motion capture">
      <form method="dialog">
        <button type="submit" class="lightbox-close" aria-label="Close">Close</button>
      </form>
      <img id="lightbox-image" alt="" />
      <p id="lightbox-caption"></p>
      <div class="lightbox-nav">
        <button type="button" id="lightbox-prev">Previous</button>
        <button type="button" id="lightbox-next">Next</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
